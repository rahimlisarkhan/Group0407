<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <title>Create Blog</title>
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <a href="../../../index.html" class="btn btn-outline-secondary mb-4"
        >&larr; Back</a
      >

      <h1 id="titleMode" class="mb-4"></h1>

      <div id="alert" class="alert d-none" role="alert"></div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="mb-3">
            <label for="titleInput" class="form-label">Title</label>
            <input
              id="titleInput"
              type="text"
              class="form-control"
              placeholder="Blog title" />
          </div>

          <div class="mb-3">
            <label for="descInput" class="form-label">Description</label>
            <textarea
              id="descInput"
              class="form-control"
              rows="6"
              placeholder="Write your blog..."></textarea>
          </div>

          <button id="send-btn" type="button" class="btn btn-primary">
            <span
              id="btn-spinner"
              class="spinner-border spinner-border-sm d-none"
              aria-hidden="true"></span>
            <span id="btn-text">Send</span>
          </button>
        </div>
      </div>
    </div>

    <script src="../../api/blog.js"></script>
    <script src="./create.js"></script>
  </body>
</html>
