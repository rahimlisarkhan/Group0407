<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h1 class="h4 text-center mb-4">Todo App</h1>

              <div class="d-flex gap-2 mb-4">
                <input
                  id="todo-input"
                  type="text"
                  class="form-control"
                  placeholder="Yeni tapsiriq yaz..."
                  autocomplete="off" />
                <button
                  id="clear-btn"
                  type="submit"
                  class="btn btn-outline-primary px-4">
                  Clear
                </button>
                <button
                  id="save-btn"
                  type="submit"
                  class="btn btn-primary px-4">
                  Save
                </button>
              </div>

              <div
                id="alertCheck"
                class="alert alert-danger alert-dismissible d-none fade show"
                role="alert">
                Zehmet olmasa duzgun doldurun!
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="alert"
                  aria-label="Close"></button>
              </div>

              <ul id="todo-list" class="list-group list-group-flush">
                <!-- JS terefinden doldurulacaq. Nümunə item: -->
                <!-- <li
                  class="list-group-item d-flex justify-content-between align-items-center px-0">
                  <span>Nümunə tapsiriq</span>
                  <button class="btn btn-sm btn-outline-danger">Delete</button>
                </li> -->
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script> -->
    <!-- <script src="./js/bom.js"></script> -->
    <script src="./js/main.js"></script>
  </body>
</html>
